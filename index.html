<title>Goals</title>
<style>
:root{--bg:#0b0d12;--card:#151a23;--card2:#1c2230;--line:#262e3e;--text:#eef1f7;--muted:#8b94a8;--dim:#5d6578;--accent:#8b5cf6;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.3;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;color:var(--text)}
.top{margin:8px 2px 16px}
.eyebrow{display:block;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.h1{display:block;margin:2px 0 0;font-size:32px;letter-spacing:-.025em;font-weight:800}
.hbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:14px}
.hbtn .htxt{flex:1;min-width:0}
.hbtn .cal{width:42px;height:42px;border-radius:13px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);flex:none}
.hbtn .cal svg{width:22px;height:22px}
.hbtn.static{cursor:default}
.hbtn.static .cal{display:none}
.hbtn:not(.static) .h1::after{content:"";display:inline-block;width:9px;height:9px;border-right:2.5px solid var(--accent);border-bottom:2.5px solid var(--accent);transform:rotate(45deg);margin:0 0 8px 12px;vertical-align:middle}
.hbtn:not(.static):active .htxt{opacity:.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.section-t{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.section-t span{font-weight:500;text-transform:none;letter-spacing:0;color:var(--dim)}
.iconbtn{width:36px;height:36px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px;display:grid;place-items:center;flex:none}

.weekstrip{display:flex;align-items:center;gap:6px}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:14px;border:1px solid transparent}
.day small{font-size:11px;color:var(--muted);font-weight:600}
.day b{font-size:16px}
.day i{width:5px;height:5px;border-radius:50%;background:transparent}
.day i.on{background:var(--ok)}
.day.today b{color:var(--accent)}
.day.sel{background:var(--card2);border-color:var(--line)}
.day.sel.today{background:var(--accent);border-color:var(--accent)}
.day.sel.today b,.day.sel.today small{color:#fff}

.summary{display:flex;align-items:center;gap:16px;margin-top:16px;background:linear-gradient(135deg,#1d1736,#121a2b);border-color:#2c2650}
.summary h3{margin:0 0 4px;font-size:17px}
.summary p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--muted);margin-top:8px;margin-right:4px}

.ring{position:relative;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring svg circle{transition:stroke-dashoffset .5s ease}
.ring span{position:relative;font-weight:800;font-size:12px}
.ring.lg span{font-size:24px}
.ring.xl span{font-size:30px}

.gcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;transition:border-color .3s}
.gcard.done{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.gcard.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.03)}100%{transform:scale(1)}}
.grow{display:flex;align-items:center;gap:12px}
.gicon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c) 18%,transparent);flex:none}
.gtxt{flex:1;min-width:0}
.gname{display:block;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsub{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.gsub .badge{color:var(--ok);font-weight:700}
.bar{height:6px;border-radius:99px;background:var(--line);margin:12px 0;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c);transition:width .5s ease}
.tickbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:15px;transition:background .2s}
.tickbtn .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--dim);display:grid;place-items:center;font-size:14px;color:#0b0d12}
.tickbtn.on{background:color-mix(in srgb,var(--c) 22%,var(--card2));border-color:color-mix(in srgb,var(--c) 60%,transparent)}
.tickbtn.on .chk{background:var(--c);border-color:var(--c)}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:5px}
.stepper button{width:40px;height:40px;border-radius:11px;background:var(--card);font-size:22px;font-weight:600}
.stepper button.plus{background:var(--c,var(--accent));color:#0b0d12}
.stepper span{font-weight:700;font-size:15px}
.amt{display:flex;align-items:center;gap:8px}
.amtday{flex:1;min-width:0}
.amtday span{display:block;font-size:12px;color:var(--muted)}
.amtday b{font-size:17px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--c,var(--accent)) 20%,var(--card2));border:1px solid color-mix(in srgb,var(--c,var(--accent)) 40%,transparent);font-weight:700;font-size:14px}
.chip.ghost{background:var(--card2);border-color:var(--line)}

/* swipe + press and hold */
.sw{position:relative;margin-bottom:10px;border-radius:var(--r);overflow:hidden}
.sw>.gcard{margin-bottom:0}
.swbg{position:absolute;inset:0;border-radius:var(--r)}
.swbg div{position:absolute;inset:0;display:flex;align-items:center;padding:0 22px;font-weight:800;font-size:15px;color:#fff;opacity:0}
.swbg .bl{justify-content:flex-start}
.swbg .br{justify-content:flex-end}
.sw.dir-r .bl,.sw.dir-l .br{opacity:1}
.swbg .a-delete{background:#dc2626}
.swbg .a-hide{background:#64748b}
.swbg .a-edit{background:var(--accent)}
.swbg span{display:inline-block;transition:transform .15s;opacity:.75}
.sw.armed .swbg span{transform:scale(1.18);opacity:1}
.swi{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.swi.anim{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.swi.pressing{transform:scale(.97);transition:transform .3s .12s}
.lcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.lcard .chev{color:var(--dim);font-size:20px}
.lcard.hid{opacity:.6;margin-bottom:8px}
.sw.row{margin-bottom:8px}

/* progress */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.seg.sm button{font-size:13px;padding:9px 2px}
.pnav{display:flex;align-items:center;justify-content:space-between;margin:14px 0}
.pnav b{font-size:17px}
.hero{display:flex;align-items:center;gap:18px}
.hero h3{margin:0;font-size:20px}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
.chart{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.col .v{font-size:10px;color:var(--muted);font-weight:700}
.col .b{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--accent),#5b3fd1);min-height:3px;transition:height .5s}
.col .b.empty{background:var(--line)}
.col small{font-size:11px;color:var(--dim);font-weight:600}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0;padding-top:2px}
.prow .gicon{width:38px;height:38px;font-size:19px;border-radius:12px}
.pct{font-weight:800;font-size:15px;flex:none}
.dots{display:flex;gap:3px;margin-top:5px}
.dots i{width:14px;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--c)}
.empty-msg{color:var(--muted);text-align:center;padding:18px 8px;font-size:14px;line-height:1.5}

.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:700;text-align:center;margin-top:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.danger-fill{background:#dc2626;border-color:#dc2626;color:#fff}
.hint{color:var(--muted);font-size:13px;line-height:1.5;margin:10px 4px 0}

/* menus */
.menuhead{display:flex;align-items:center;gap:12px;padding:2px 2px 16px}
.mlist{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mitem{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;font-size:16px;font-weight:600;border-top:1px solid var(--line);text-align:left}
.mitem:first-child{border-top:0}
.mitem:active{background:var(--card2)}
.mitem .mi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:var(--card2)}
.mitem.danger{color:var(--bad)}

/* calendar */
.calnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.calnav b{font-size:18px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .wd{font-size:11px;font-weight:700;color:var(--dim);text-align:center;padding-bottom:4px}
.cd{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:15px;border:1px solid transparent;background:var(--card)}
.cd.today{color:var(--accent);border-color:var(--accent)}
.cd.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.cd .dd{display:flex;gap:2px;height:5px}
.cd .dd i{width:5px;height:5px;border-radius:50%}
.cd.sel .dd i{box-shadow:0 0 0 1px #fff}

/* settings */
.setrow{padding:14px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0;padding-top:2px}
.setrow:last-child{padding-bottom:2px}
.setrow>b{display:block;font-size:15px;margin-bottom:2px}
.setrow>small{display:block;color:var(--muted);font-size:13px;margin-bottom:10px}

/* tabbar + fab */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);background:rgba(11,13,18,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:20}
.tabbar button{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--dim);font-size:11px;font-weight:700}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--text)}
.tabbar button.on svg{color:var(--accent)}
#fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(env(safe-area-inset-bottom) + 82px);width:58px;height:58px;border-radius:20px;background:var(--accent);color:#fff;font-size:32px;font-weight:300;box-shadow:0 10px 30px rgba(139,92,246,.45);z-index:21;display:grid;place-items:center;transition:transform .15s}
#fab:active{transform:scale(.92)}
#fab.hide{display:none}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;pointer-events:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;overflow-y:auto;background:#12161f;border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:8px 18px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.open{pointer-events:auto}
.sheet-wrap.open .backdrop{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;position:sticky;top:-8px;background:#12161f;padding:6px 0;z-index:2}
.sheet-h b{font-size:17px}
.sheet-h button{color:var(--muted);font-weight:600;padding:6px 2px}
.sheet-h button.save{color:var(--accent);font-weight:800}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 8px}
.inp{width:100%;padding:13px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:16px;outline:none}
.inp:focus{border-color:var(--accent)}
.preview{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.preview .gicon{width:48px;height:48px;font-size:24px}
.preview b{display:block;font-size:16px}
.preview small{color:var(--muted);font-size:13px}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.ico{aspect-ratio:1;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px}
.ico.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--card))}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.sw-c{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 2px transparent}
.sw-c.sel{border-color:#12161f;box-shadow:0 0 0 2px var(--text)}
.typecards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{text-align:left;padding:14px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:4px}
.tcard .tic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--card2);font-weight:800;margin-bottom:4px}
.tcard small{color:var(--muted);font-size:12px;line-height:1.35}
.tcard.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--card))}
.tcard.sel .tic{background:var(--c);color:#0b0d12}
.targetrow{display:flex;gap:10px}
.targetrow .stepper{flex:1.2;padding:4px}
.targetrow .stepper input{width:60px;text-align:center;background:none;border:0;font-weight:800;font-size:20px;outline:none}
.targetrow .unit{flex:1;min-width:0}
.unitchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.unitchips button{padding:7px 11px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.unitchips button.sel{color:var(--text);border-color:var(--c)}
.toggle{position:relative;display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);cursor:pointer}
.toggle.flat{background:none;border:0;padding:0;border-radius:0}
.toggle span{flex:1}
.toggle b{display:block;font-size:15px}
.toggle small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.toggle i{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle input:checked+i{background:var(--ok)}
.toggle input:checked+i::after{transform:translateX(20px)}
.toggle input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.err{color:var(--bad);font-size:13px;margin:8px 2px 0;min-height:1em}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);transform:translate(-50%,20px);display:flex;align-items:center;gap:16px;background:#232a3a;border:1px solid #333c50;padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:all .3s;z-index:60;pointer-events:none;white-space:nowrap;max-width:90vw}
#toast span{overflow:hidden;text-overflow:ellipsis}
#toast button{color:#a78bfa;font-weight:800;flex:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.act{pointer-events:auto}
</style>
</head>
<body>
<div id="app">
  <header class="top"><button type="button" class="hbtn" id="hBtn" data-act="calendar"><span class="htxt"><span class="eyebrow" id="hEye"></span><span class="h1" id="hTitle" role="heading" aria-level="1"></span></span><span class="cal" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="4"/><path d="M8 2v4M16 2v4M3 10h18"/><circle cx="8" cy="15" r="1" fill="currentColor"/><circle cx="12" cy="15" r="1" fill="currentColor"/><circle cx="16" cy="15" r="1" fill="currentColor"/></svg></span></button></header>
  <main id="view"></main>
</div>

<button id="fab" type="button" data-act="newGoal" aria-label="Create goal">+</button>

<nav class="tabbar" aria-label="Sections">
  <button type="button" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="4"/><path d="M8 2v4M16 2v4M8.5 13.5l2.5 2.5 4.5-5"/></svg>Today</button>
  <button type="button" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-5"/></svg>Progress</button>
  <button type="button" data-tab="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>Goals</button>
  <button type="button" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>

<div class="sheet-wrap" id="sheetWrap" aria-hidden="true">
  <div class="backdrop" data-act="close"></div>
  <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script>
(function(){
"use strict";
var STORE='goalTracker.v2';
var ICONS=['📚','🏋️','🏃','🚴','🧘','💧','🥗','😴','💻','✍️','🎸','🌍','💰','🧠','📵','🎯'];
var COLORS=['#8b5cf6','#22d3ee','#34d399','#fbbf24','#f472b6','#f87171','#60a5fa','#a3e635'];
var UNITS=['min','hours','pages','km','€','glasses'];
var DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var DOWL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
var ORDER={week:0,month:1,year:2};
var ACT={delete:{l:'Delete',i:'🗑'},hide:{l:'Hide',i:'🙈'},edit:{l:'Edit',i:'✏️'}};

function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,10)}
function pad(n){return String(n).padStart(2,'0')}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseK(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function dow(d){return (d.getDay()+6)%7}
function sow(d){return addDays(d,-dow(d))}
function som(d){return new Date(d.getFullYear(),d.getMonth(),1)}
function range(p,d){
  if(p==='week'){var s=sow(d);return[s,addDays(s,6)]}
  if(p==='month'){return[som(d),new Date(d.getFullYear(),d.getMonth()+1,0)]}
  return[new Date(d.getFullYear(),0,1),new Date(d.getFullYear(),11,31)];
}
function fmt(n){n=Number(n)||0;return Number.isInteger(n)?String(n):String(Math.round(n*10)/10)}
function shortDate(d){return d.getDate()+' '+MON[d.getMonth()]}
function todayK(){return key(new Date())}

/* ---------- storage (same key as v2: your data is kept) ---------- */
function defSet(){return{swipeRight:'delete',swipeLeft:'hide',confirmDelete:true,longPress:true}}
function norm(s){s.settings=Object.assign(defSet(),s.settings||{});return s}
function seed(){
  var now=new Date();
  return {goals:[
    {id:uid(),name:'Read',icon:'📚',color:'#8b5cf6',type:'amount',target:60,unit:'min',period:'week',quick:[10,20,30],oncePerDay:true,created:key(sow(now))},
    {id:uid(),name:'Go to the gym',icon:'🏋️',color:'#34d399',type:'tick',target:3,unit:'times',period:'week',quick:[],oncePerDay:true,created:key(sow(now))},
    {id:uid(),name:'Finish a book',icon:'🎯',color:'#fbbf24',type:'tick',target:1,unit:'book',period:'month',quick:[],oncePerDay:true,created:key(som(now))}
  ],logs:{},settings:defSet()};
}
function load(){try{var s=JSON.parse(localStorage.getItem(STORE));if(s&&Array.isArray(s.goals)&&s.logs)return norm(s)}catch(e){}return seed()}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}
var state=load();save();
function live(){return state.goals.filter(function(g){return !g.archived})}
function find(id){return state.goals.find(function(x){return x.id===id})}

function getLog(k,id){var l=state.logs[k];return(l&&l[id])||0}
function setLog(k,id,v){
  v=Math.max(0,Math.round(v*100)/100);
  if(!state.logs[k])state.logs[k]={};
  if(v>0)state.logs[k][id]=v;else delete state.logs[k][id];
  if(!Object.keys(state.logs[k]).length)delete state.logs[k];
}
function sumGoal(g,s,e){var a=key(s),b=key(e),t=0;for(var k in state.logs){if(k>=a&&k<=b){var v=state.logs[k][g.id];if(v)t+=v}}return t}
function ratio(g,d){var r=range(g.period,d);return Math.min(1,sumGoal(g,r[0],r[1])/g.target)}
function activeIn(g,p,d){return key(range(p,d)[1])>=g.created}
function units(g,s,e){
  var out=[],today=new Date(),d=range(g.period,s)[0];
  while(d<=e&&d<=today){
    if(key(range(g.period,d)[1])>=g.created)out.push(new Date(d));
    d=g.period==='week'?addDays(d,7):g.period==='month'?new Date(d.getFullYear(),d.getMonth()+1,1):new Date(d.getFullYear()+1,0,1);
  }
  return out;
}
function computeView(view,ref){
  var r=range(view,ref),items=[];
  live().forEach(function(g){
    if(ORDER[g.period]>ORDER[view])return;
    var us=units(g,r[0],r[1]);if(!us.length)return;
    var rs=us.map(function(u){return ratio(g,u)});
    var it={g:g,score:rs.reduce(function(a,b){return a+b},0)/rs.length,hit:rs.filter(function(x){return x>=1}).length,n:us.length};
    if(g.period===view){var gr=range(g.period,ref);it.tot=sumGoal(g,gr[0],gr[1])}
    items.push(it);
  });
  var overall=items.length?items.reduce(function(a,b){return a+b.score},0)/items.length:null;
  return{items:items,overall:overall,done:items.filter(function(i){return i.score>=1}).length,total:items.length};
}

/* ---------- ui helpers ---------- */
function ring(r,size,sw,color,label,cls){
  var rad=(size-sw)/2,c=2*Math.PI*rad,h=size/2;
  var arc=r>0?'<circle cx="'+h+'" cy="'+h+'" r="'+rad+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-Math.min(1,r)))+'" transform="rotate(-90 '+h+' '+h+')"/>':'';
  return '<div class="ring '+(cls||'')+'" style="width:'+size+'px;height:'+size+'px"><svg viewBox="0 0 '+size+' '+size+'"><circle cx="'+h+'" cy="'+h+'" r="'+rad+'" fill="none" stroke="#262e3e" stroke-width="'+sw+'"/>'+arc+'</svg><span>'+label+'</span></div>';
}
function scoreColor(r){return r>=1?'#34d399':r>=.5?'#8b5cf6':r>0?'#fbbf24':'#5d6578'}
var toastT;
function toast(msg,undo){
  var t=$('#toast');t.innerHTML='';var sp=document.createElement('span');sp.textContent=msg;t.appendChild(sp);
  if(undo){var b=document.createElement('button');b.type='button';b.textContent='Undo';b.addEventListener('click',function(e){e.stopPropagation();clearTimeout(toastT);t.classList.remove('show','act');undo()});t.appendChild(b)}
  t.classList.toggle('act',!!undo);t.classList.add('show');clearTimeout(toastT);
  toastT=setTimeout(function(){t.classList.remove('show','act')},undo?5000:2200);
}
function hdr(eye,title){$('#hEye').textContent=eye;$('#hTitle').textContent=title}
function describe(g){
  var n=g.type==='tick'?(g.target===1?'once':fmt(g.target)+(g.unit==='times'?' times':' '+g.unit)):fmt(g.target)+' '+g.unit;
  return (g.type==='tick'?'Ticks':'Amount')+' · '+n+' per '+g.period;
}
function swWrap(g,inner,cls){
  var S=state.settings,r=S.swipeRight,l=S.swipeLeft;
  return '<div class="sw '+(cls||'')+'" data-gid="'+g.id+'"><div class="swbg">'+
    (ACT[r]?'<div class="bl a-'+r+'"><span>'+ACT[r].i+' '+ACT[r].l+'</span></div>':'')+
    (ACT[l]?'<div class="br a-'+l+'"><span>'+ACT[l].l+' '+ACT[l].i+'</span></div>':'')+
    '</div>'+inner+'</div>';
}

var tab='today',sel=new Date(),pView='week',pRef=new Date(),draft=null,popId=null,calRef=new Date();

/* ---------- TODAY ---------- */
function goalCard(g,dk,isToday){
  var r=range(g.period,sel),tot=sumGoal(g,r[0],r[1]),rr=Math.min(1,tot/g.target),pct=Math.round(rr*100),today=getLog(dk,g.id),act;
  var dayWord=isToday?'today':'this day';
  if(g.type==='tick'){
    if(g.oncePerDay){
      act='<button type="button" class="tickbtn '+(today?'on':'')+'" data-act="tick" data-id="'+g.id+'"><span class="chk">'+(today?'✓':'')+'</span>'+(today?'Done '+dayWord:'Mark as done '+dayWord)+'</button>';
    }else{
      act='<div class="stepper"><button type="button" data-act="dec" data-id="'+g.id+'" aria-label="Remove one" '+(today?'':'disabled')+'>−</button><span>'+fmt(today)+' '+esc(g.unit)+' '+dayWord+'</span><button type="button" class="plus" data-act="inc" data-id="'+g.id+'" aria-label="Add one">+</button></div>';
    }
  }else{
    var chips=(g.quick||[]).map(function(q){return '<button type="button" class="chip" data-act="add" data-id="'+g.id+'" data-v="'+q+'">+'+fmt(q)+'</button>'}).join('');
    act='<div class="amt"><div class="amtday"><span>Logged '+dayWord+'</span><b>'+fmt(today)+' '+esc(g.unit)+'</b></div><div class="chips">'+chips+'<button type="button" class="chip ghost" data-act="log" data-id="'+g.id+'" aria-label="Enter amount">✎</button></div></div>';
  }
  var sub=fmt(tot)+' / '+fmt(g.target)+' '+esc(g.unit)+(rr>=1?' · <span class="badge">Completed 🎉</span>':' · this '+g.period);
  return swWrap(g,'<div class="gcard swi '+(rr>=1?'done ':'')+(popId===g.id?'pop':'')+'" style="--c:'+g.color+'">'+
    '<div class="grow"><div class="gicon">'+g.icon+'</div><div class="gtxt"><div class="gname">'+esc(g.name)+'</div><div class="gsub">'+sub+'</div></div>'+ring(rr,48,5,g.color,pct+'%')+'</div>'+
    '<div class="bar"><i style="width:'+pct+'%"></i></div>'+act+'</div>');
}
function renderToday(){
  var dk=key(sel),tk=todayK(),isToday=dk===tk,ws=sow(sel);
  hdr(isToday?'Today':'Logging for',DOWL[dow(sel)]+' '+shortDate(sel));
  var h='<div class="weekstrip"><button type="button" class="iconbtn" data-act="prevWeek" aria-label="Previous week">‹</button><div class="days">';
  for(var i=0;i<7;i++){
    var d=addDays(ws,i),k=key(d),has=state.logs[k]&&Object.keys(state.logs[k]).length;
    h+='<button type="button" class="day '+(k===dk?'sel ':'')+(k===tk?'today':'')+'" data-act="day" data-k="'+k+'" '+(k>tk?'disabled':'')+'><small>'+DOW[i][0]+'</small><b>'+d.getDate()+'</b><i class="'+(has?'on':'')+'"></i></button>';
  }
  h+='</div><button type="button" class="iconbtn" data-act="nextWeek" aria-label="Next week" '+(key(addDays(ws,7))>tk?'disabled':'')+'>›</button></div>';
  var L=live(),vis=L.filter(function(g){return activeIn(g,g.period,sel)});
  if(!L.length){
    h+='<div class="card" style="margin-top:16px"><div class="empty-msg">No active goals.<br>Tap <b>+</b> to create one.</div><button type="button" class="btn primary" data-act="newGoal">Create a goal</button></div>';
    $('#view').innerHTML=h;return;
  }
  var w=computeView('week',sel),m=computeView('month',sel),wp=w.overall==null?0:w.overall;
  h+='<div class="card summary">'+ring(wp,76,7,scoreColor(wp),Math.round(wp*100)+'%','lg')+'<div><h3>'+(wp>=1?'Perfect week! 🔥':'This week')+'</h3><p>'+(w.total?w.done+' of '+w.total+' weekly goals completed':'No weekly goals yet')+'</p><span class="pill">Month '+(m.overall==null?'–':Math.round(m.overall*100)+'%')+'</span><span class="pill">'+range('week',sel)[0].getDate()+'–'+shortDate(range('week',sel)[1])+'</span></div></div>';
  ['week','month','year'].forEach(function(p){

/* ---------- gestures: swipe + press and hold ---------- */
var G=null,suppress=false;
function cancelPress(){if(G){clearTimeout(G.t);G.it.classList.remove('pressing')}}
document.addEventListener('pointerdown',function(e){
  if(e.button>0||sheetOpen())return;
  var it=e.target.closest('.swi'),wrap=it&&it.closest('.sw');if(!wrap)return;
  G={it:it,wrap:wrap,id:wrap.dataset.gid,x:e.clientX,y:e.clientY,dx:0,mode:null,pid:e.pointerId,w:it.offsetWidth||300,armed:false};
  if(state.settings.longPress){
    it.classList.add('pressing');
    G.t=setTimeout(function(){if(!G||G.mode)return;G.mode='press';G.it.classList.remove('pressing');suppress=true;if(navigator.vibrate)navigator.vibrate(12);openMenu(G.id)},480);
  }
});
document.addEventListener('pointermove',function(e){
  if(!G||e.pointerId!==G.pid||G.mode==='press')return;
  var dx=e.clientX-G.x,dy=e.clientY-G.y;
  if(!G.mode){
    if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2){G.mode='swipe';cancelPress();G.it.classList.remove('anim');try{G.it.setPointerCapture(G.pid)}catch(_){}}
    else if(Math.abs(dy)>10){cancelPress();G=null;return}
    else return;
  }
  var act=dx>0?state.settings.swipeRight:state.settings.swipeLeft;
  if(!ACT[act])dx*=0.15;
  G.dx=dx;G.it.style.transform='translateX('+dx+'px)';
  G.wrap.classList.toggle('dir-r',dx>0);G.wrap.classList.toggle('dir-l',dx<0);
  var armed=!!ACT[act]&&Math.abs(dx)>Math.min(130,G.w*.35);
  if(armed!==G.armed){G.armed=armed;G.wrap.classList.toggle('armed',armed);if(armed&&navigator.vibrate)navigator.vibrate(8)}
});
function endG(e){
  if(!G||e.pointerId!==G.pid)return;
  cancelPress();var g=G;G=null;
  if(g.mode==='swipe'){
    suppress=true;setTimeout(function(){suppress=false},350);
    var act=g.dx>0?state.settings.swipeRight:state.settings.swipeLeft;
    g.it.classList.add('anim');
    var back=function(){g.it.style.transform='';setTimeout(function(){g.wrap.classList.remove('dir-r','dir-l','armed')},260)};
    if(g.armed&&e.type==='pointerup'&&ACT[act]){
      if(act==='hide'||(act==='delete'&&!state.settings.confirmDelete)){g.it.style.transform='translateX('+(g.dx>0?'':'-')+'110%)';setTimeout(function(){doAction(act,g.id)},220)}
      else{back();setTimeout(function(){doAction(act,g.id)},120)}
    }else back();
  }else if(g.mode==='press'){setTimeout(function(){suppress=false},400)}
}
document.addEventListener('pointerup',endG);
document.addEventListener('pointercancel',endG);
document.addEventListener('click',function(e){if(suppress){suppress=false;e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('contextmenu',function(e){var w=e.target.closest('.sw');if(!w)return;e.preventDefault();if(state.settings.longPress&&!sheetOpen()){cancelPress();G=null;openMenu(w.dataset.gid)}});
document.addEventListener('change',function(e){var k=e.target.dataset&&e.target.dataset.setc;if(k){state.settings[k]=e.target.checked;save()}});

function drawCal(){
  var now=new Date(),tk=todayK(),sk=key(sel),y=calRef.getFullYear(),m=calRef.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),off=dow(first);
  var atNow=y===now.getFullYear()&&m===now.getMonth(),mv=computeView('month',first);
  var h='<div class="sheet-h"><button type="button" data-act="close">Close</button><b>Calendar</b><button type="button" class="save" data-act="calToday">Today</button></div>';
  h+='<div class="calnav"><button type="button" class="iconbtn" data-act="calPrev" aria-label="Previous month">‹</button><div style="text-align:center"><b>'+MONL[m]+' '+y+'</b><div class="gsub">Month score '+(mv.overall==null?'–':Math.round(mv.overall*100)+'%')+'</div></div><button type="button" class="iconbtn" data-act="calNext" aria-label="Next month" '+(atNow?'disabled':'')+'>›</button></div>';
  h+='<div class="calgrid">'+DOW.map(function(d){return '<div class="wd">'+d[0]+'</div>'}).join('');
  for(var i=0;i<off;i++)h+='<div></div>';
  for(var d=1;d<=days;d++){
    var dt=new Date(y,m,d),k=key(dt),gs=Object.keys(state.logs[k]||{}).map(find).filter(function(g){return g&&!g.archived});
    h+='<button type="button" class="cd '+(k===tk?'today ':'')+(k===sk?'sel':'')+'" data-act="calPick" data-k="'+k+'" '+(k>tk?'disabled':'')+' aria-label="'+DOWL[dow(dt)]+' '+d+' '+MONL[m]+(gs.length?', '+gs.length+' goals logged':'')+'">'+d+'<span class="dd">'+gs.slice(0,3).map(function(g){return '<i style="background:'+g.color+'"></i>'}).join('')+'</span></button>';
  }
  h+='</div><p class="hint" style="text-align:center">Dots show the goals you logged that day. Tap a day to open it.</p>';
  openSheet(h);
}

/* ---------- actions ---------- */
function mutate(g,fn){
  var r=range(g.period,sel),before=sumGoal(g,r[0],r[1])/g.target;
  fn();save();
  if(before<1&&sumGoal(g,r[0],r[1])/g.target>=1){popId=g.id;toast('🎉 '+g.name+' — goal reached!')}
  render();
}
function exportData(){
  var name='goals-backup-'+todayK()+'.json',blob=new Blob([JSON.stringify(state)],{type:'application/json'});
  try{var file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Goals backup'}).catch(function(){});return}}catch(e){}
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded');
}
$('#importFile').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){try{var s=JSON.parse(rd.result);if(!s||!Array.isArray(s.goals)||typeof s.logs!=='object')throw 0;if(confirm('Replace your current goals and history with this backup?')){state=norm(s);save();render();toast('Backup restored')}}catch(err){toast('That file isn\u2019t a valid backup')}e.target.value=''};
  rd.readAsText(f);
});

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act],[data-tab],[data-icon],[data-color],[data-type],[data-per],[data-unit],[data-pview],[data-set]');
  if(!t||t.disabled)return;
  var ds=t.dataset;
  if(ds.tab){tab=ds.tab;if(tab==='today')sel=new Date();render();window.scrollTo(0,0);return}
  if(ds.pview){pView=ds.pview;pRef=new Date();render();return}
  if(ds.set){state.settings[ds.set]=ds.val;save();render();return}
  if(draft&&(ds.icon||ds.color||ds.type||ds.per||ds.unit)){
    readForm();
    if(ds.icon)draft.icon=ds.icon;
    if(ds.color)draft.color=ds.color;
    if(ds.per)draft.period=ds.per;
    if(ds.unit)draft.unit=ds.unit;
    if(ds.type&&ds.type!==draft.type){
      draft.type=ds.type;
      if(ds.type==='amount'){if(!draft.unit||draft.unit==='times')draft.unit='min';if(draft.target<=3)draft.target=60}
      else{if(UNITS.indexOf(draft.unit)>=0||!draft.unit)draft.unit='times';if(draft.target>7)draft.target=3}
    }
    refreshForm();return;
  }
  var a=ds.act,g=ds.id&&find(ds.id),dk=key(sel);
  switch(a){
    case 'newGoal':openGoalForm(null);break;
    case 'edit':if(g)openGoalForm(g);break;
    case 'close':closeSheet();break;
    case 'saveGoal':saveGoal();break;
    case 'deleteGoal':if(draft&&draft.id){var dg=find(draft.id);draft=null;if(dg)askDelete(dg)}break;
    case 'formHide':if(draft&&draft.id){var hg=find(draft.id);closeSheet();if(hg)hideGoal(hg,!hg.archived)}break;
    case 'menu':if(g){var d=ds.do;if(d==='edit')openGoalForm(g);else if(d==='delete')askDelete(g);else{closeSheet();hideGoal(g,d==='hide')}}break;
    case 'confirmDel':if(g){closeSheet();deleteGoal(g)}break;
    case 'menuOpen':if(g)openMenu(g.id);break;
    case 'calendar':if(tab==='today')openCalendar();break;
    case 'calPrev':calRef=new Date(calRef.getFullYear(),calRef.getMonth()-1,1);drawCal();break;
    case 'calNext':calRef=new Date(calRef.getFullYear(),calRef.getMonth()+1,1);drawCal();break;
    case 'calToday':sel=new Date();closeSheet();render();break;
    case 'calPick':sel=parseK(ds.k);closeSheet();render();break;
    case 'tMinus':readForm();draft.target=Math.max(1,(draft.target||1)-(draft.type==='amount'&&draft.target>10?5:1));refreshForm();break;
    case 'tPlus':readForm();draft.target=(draft.target||0)+(draft.type==='amount'&&draft.target>=10?5:1);refreshForm();break;
    case 'tick':if(g)mutate(g,function(){setLog(dk,g.id,getLog(dk,g.id)?0:1)});break;
    case 'inc':if(g)mutate(g,function(){setLog(dk,g.id,getLog(dk,g.id)+1)});break;
    case 'dec':if(g)mutate(g,function(){setLog(dk,g.id,getLog(dk,g.id)-1)});break;
    case 'add':if(g){var v=parseFloat(ds.v);mutate(g,function(){setLog(dk,g.id,getLog(dk,g.id)+v)});if(popId!==g.id)toast('+'+fmt(v)+' '+g.unit+' logged')}break;
    case 'log':if(g)openLog(g);break;
    case 'saveLog':
      if(g){var raw=$('#lVal').value.trim(),n=raw===''?0:parseFloat(raw);if(!isFinite(n)||n<0||n>100000){$('#lErr').textContent='Enter a number of 0 or more.';return}closeSheet();mutate(g,function(){setLog(dk,g.id,n)})}
      break;
    case 'day':sel=parseK(ds.k);render();break;
    case 'prevWeek':sel=addDays(sel,-7);render();break;
    case 'nextWeek':var nx=addDays(sel,7);sel=nx>new Date()?new Date():nx;render();break;
    case 'pPrev':pRef=pView==='week'?addDays(pRef,-7):pView==='month'?new Date(pRef.getFullYear(),pRef.getMonth()-1,1):new Date(pRef.getFullYear()-1,0,1);render();break;
    case 'pNext':pRef=pView==='week'?addDays(pRef,7):pView==='month'?new Date(pRef.getFullYear(),pRef.getMonth()+1,1):new Date(pRef.getFullYear()+1,0,1);if(pRef>new Date())pRef=new Date();render();break;
    case 'export':exportData();break;
    case 'import':$('#importFile').click();break;
    case 'reset':if(confirm('Delete all goals and history? This can\u2019t be undone.')){state={goals:[],logs:{},settings:state.settings};save();render();toast('All data deleted')}break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&sheetOpen())closeSheet();
  if(e.key==='Enter'&&e.target&&e.target.id==='lVal'){var b=document.querySelector('[data-act="saveLog"]');if(b)b.click()}
});

function render(){
  document.querySelectorAll('.tabbar button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===tab)});
  $('#fab').classList.toggle('hide',tab==='progress'||tab==='settings');
  var hb=$('#hBtn');hb.classList.toggle('static',tab!=='today');
  if(tab==='today')hb.setAttribute('aria-label','Open calendar');else hb.removeAttribute('aria-label');
  if(tab==='today')renderToday();else if(tab==='progress')renderProgress();else if(tab==='goals')renderGoals();else renderSettings();
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!sheetOpen())render()});
render();
})();
</script>
</body>
</html>
